experiment: formal_e2_imbalance_boundary
seed: 42
data_root: data/raw
train_split: train
val_split: val
input_mode: e2
batch_size: 32
epochs: 12
learning_rate: 0.001
base_channels: 16
pos_weight: 4.0
max_train_samples: null
max_val_samples: null
num_workers: 4
sampling:
  strategy: flood_fraction_bins
  cache_workers: 8
  thresholds: [0.0, 0.01, 0.10]
  target_probabilities: [0.20, 0.25, 0.30, 0.25]
loss:
  type: focal_tversky
  focal_gamma: 2.0
  focal_weight: 1.0
  tversky_weight: 1.0
  tversky_alpha: 0.60
  tversky_beta: 0.40
  boundary_weight: 2.0
  boundary_kernel_size: 5
output_dir: outputs/formal_e2_imbalance_boundary
