experiment: future_event_forecast_smoke
task: future_event_forecast
manifest: data/split/future_event_forecast_manifest.json
seed: 42
data_root: data/raw
train_split: train
val_split: val
input_mode: e2
input_channels: 4
model: historical_flood_forecast_net
batch_size: 8
epochs: 2
learning_rate: 0.001
base_channels: 8
pos_weight: 2.0
num_workers: 0
loss:
  type: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 1.0
  boundary_kernel_size: 5
  presence_weight: 0.25
  boundary_aux_weight: 0.2
  boundary_aux_kernel_size: 5
  boundary_aux_pos_weight: 2.0
  boundary_aux_dice_weight: 0.5
output_dir: outputs/future_event_forecast_smoke
